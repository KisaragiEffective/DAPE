# This workflow is managed by gh actions-lock.

name: Docker Smoke Test

on:
  pull_request:

jobs:
  smoke-test:
    permissions: 
      contents: read

    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        run: |
          docker build -t dape:test .

      - name: Scan Docker image with Dockle
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: dape:test
          exit-code: '1'
          exit-level: 'warn'

      - name: Run container
        run: |
          docker run --rm dape:test --help || (echo "Container failed to start" && exit 1)
